<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME | DIVINA TENNEDA</title>
    <link rel="stylesheet" href="tennedar-style.css">
</head>
<body>
    <nav class="top-nav">
        <a href="index.html" class="nav-logo">TENNEDA</a>
        <div class="nav-links">
            <!-- 点击触发侧边栏 -->
            <a href="javascript:void(0)" onclick="toggleHistory()">HISTORY</a>
            <a href="#about">ABOUT</a>
            <a href="#works">WORKS</a>
        </div>
    </nav>

    <main class="content-container">
        <section id="hero">
            <h2 class="section-title">Fragmentary Sea</h2>
            <p>这里是 Yiling 的个人空间，记录医学研究、艺术习作与碎碎念。</p>
        </section>
        <hr class="divider">
        <section id="about">
            <h3>ABOUT</h3>
            <p>2023级清华医学本科生。专注于血液学与再生医学研究。</p>
        </section>
    </main>

    <!-- 侧边履历容器 -->
    <div id="history-overlay" class="overlay" onclick="toggleHistory()"></div>
    <div id="history-sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Update History</h3>
            <button onclick="toggleHistory()" class="close-btn">×</button>
        </div>
        <iframe src="html/history.html" frameborder="0" class="history-iframe"></iframe>
    </div>

    <script>
        function toggleHistory() {
            document.getElementById('history-sidebar').classList.toggle('active');
            document.getElementById('history-overlay').classList.toggle('active');
        }
    </script>
</body>
</html>
