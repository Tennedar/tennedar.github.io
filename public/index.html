<script>

function siteTime() {

window.setTimeout(siteTime, 1000);

const seconds = 1000;
const minutes = seconds * 60;
const hours = minutes * 60;
const days = hours * 24;
const years = days * 365;

const today = new Date();

const t1 = Date.UTC(2023,1,20,0,0,0);

const t2 = Date.UTC(
today.getFullYear(),
today.getMonth()+1,
today.getDate(),
today.getHours(),
today.getMinutes(),
today.getSeconds()
);

const diff = t2 - t1;

const diffYears = Math.floor(diff / years);
const diffDays = Math.floor((diff / days) - diffYears * 365);
const diffHours = Math.floor((diff % days) / hours);
const diffMinutes = Math.floor((diff % hours) / minutes);
const diffSeconds = Math.floor((diff % minutes) / seconds);

document.getElementById("sitetime").innerHTML =
diffYears + " Years " +
diffDays + " Days " +
diffHours + " Hours " +
diffMinutes + " Minutes " +
diffSeconds + " Seconds";

}

siteTime();

</script>
